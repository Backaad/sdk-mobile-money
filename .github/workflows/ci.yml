name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC, no token stored
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/**/pom.xml

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: java/*/target/site/jacoco/
          if-no-files-found: ignore

      # Coverage is reported, never enforced: an upload problem must not fail the build.
      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: java/sdk-mobile-money-core/target/site/jacoco/jacoco.xml,java/sdk-mobile-money-spring-boot-starter/target/site/jacoco/jacoco.xml
          disable_search: true
          flags: java
          fail_ci_if_error: false

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC, no token stored
    defaults:
      run:
        working-directory: flutter/sdk_mobile_money
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: flutter/sdk_mobile_money/coverage/lcov.info
          disable_search: true
          flags: flutter
          fail_ci_if_error: false
