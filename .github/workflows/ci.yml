name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC, no token stored
    defaults:
      run:
        working-directory: java
    services:
      # The starter's Redis stores are tested against a real Redis server.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            java/**/pom.xml
            examples/spring-boot-demo/pom.xml

      - name: Build and test
        env:
          REDIS_URL: redis://localhost:6379
          # The Redis tests must run here: fail instead of skipping them.
          MOBILE_MONEY_REQUIRE_REDIS: 'true'
        run: ./mvnw --batch-mode --no-transfer-progress install

      - name: Build and test the demo server
        run: ./mvnw --batch-mode --no-transfer-progress -f ../examples/spring-boot-demo/pom.xml verify

      - name: Upload coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: java/*/target/site/jacoco/
          if-no-files-found: ignore

      # Coverage is reported, never enforced: an upload problem must not fail the build.
      - name: Upload coverage to Codecov
        if: matrix.java == '21'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: java/sdk-mobile-money-core/target/site/jacoco/jacoco.xml,java/sdk-mobile-money-spring-boot-starter/target/site/jacoco/jacoco.xml
          disable_search: true
          flags: java
          fail_ci_if_error: false

  demo-image:
    name: Demo image (docker compose)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/spring-boot-demo
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build

      - name: Start the server and Redis, then start a payment
        run: |
          docker compose up -d --wait --wait-timeout 180 redis
          docker compose up -d demo
          # Ready when an unknown payment answers 404.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/payments/none || true)
            [ "$code" = "404" ] && break
            sleep 2
          done
          status=$(curl -s -o response.json -w '%{http_code}' -X POST localhost:8080/api/payments \
            -H 'Idempotency-Key: ci-0000-0000-0001' -H 'Content-Type: application/json' \
            -d '{"phoneNumber": "+237 670 12 34 56", "amount": 500}')
          cat response.json
          test "$status" = "201"
          grep -q '"status":"PENDING"' response.json
          docker compose exec -T redis redis-cli --scan --pattern 'mobile-money:idempotency:*' | grep -q ci-0000

      - name: Logs
        if: always()
        run: docker compose logs

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload through OIDC, no token stored
    defaults:
      run:
        working-directory: flutter/sdk_mobile_money
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: flutter/sdk_mobile_money/coverage/lcov.info
          disable_search: true
          flags: flutter
          fail_ci_if_error: false
