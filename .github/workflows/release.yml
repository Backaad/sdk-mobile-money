name: Release

# Publishes a version when its tag is pushed, for example v0.1.0 (see docs/releasing.md):
# - the Java libraries to Maven Central, where the deployment then waits to be published by hand;
# - the Flutter package to pub.dev, once automated publishing is enabled there (see the pub-dev job).
# Every key comes from the repository secrets; none is in the repository.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compare the versions with the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          java_version=$(cd java && ./mvnw --quiet --batch-mode --no-transfer-progress \
            help:evaluate -Dexpression=project.version -DforceStdout)
          dart_version=$(sed -n 's/^version: *//p' flutter/sdk_mobile_money/pubspec.yaml)
          status=0
          [ "$java_version" = "$version" ] || { echo "::error::java/pom.xml is $java_version, the tag is $version"; status=1; }
          [ "$dart_version" = "$version" ] || { echo "::error::pubspec.yaml is $dart_version, the tag is $version"; status=1; }
          # Fixed strings: a forgotten "## 0.1.0-dev" section must not pass for "## 0.1.0".
          grep -qF "## [$version] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; status=1; }
          grep -qxF "## $version" flutter/sdk_mobile_money/CHANGELOG.md \
            || { echo "::error::flutter/sdk_mobile_money/CHANGELOG.md has no $version section"; status=1; }
          exit $status

  maven-central:
    name: Maven Central
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # settings.xml gets a <server id="central"> that reads these variables.
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Build, sign and upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy

  pub-dev:
    name: pub.dev
    needs: check
    # pub.dev only takes automated publishing for a package that already exists: the first version is
    # published by hand, then the repository variable PUB_DEV_AUTOMATED_PUBLISHING is set to true.
    if: vars.PUB_DEV_AUTOMATED_PUBLISHING == 'true'
    permissions:
      id-token: write # pub.dev authenticates the workflow through OIDC, no token stored
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: flutter/sdk_mobile_money
