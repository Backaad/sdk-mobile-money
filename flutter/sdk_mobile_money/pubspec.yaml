name: sdk_mobile_money
description: >-
  Collect Mobile Money payments in Cameroon from a Flutter app, through your
  own server: provider keys never ship in the app.
version: 0.1.1
repository: https://github.com/Backaad/sdk-mobile-money/tree/main/flutter/sdk_mobile_money
issue_tracker: https://github.com/Backaad/sdk-mobile-money/issues
topics:
  - payments
  - mobile-money
  - cameroon
  - fintech
screenshots:
  - description: >-
      The demo app pays with MobileMoneyCheckout, in light and dark themes,
      in English and French.
    path: screenshots/demo.gif

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
